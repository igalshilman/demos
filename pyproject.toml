[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greeter"
version = "0.1.0"
description = "A small command-line tool that prints a friendly greeting."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
greeter = "greeter.cli:main"

[tool.setuptools.packages.find]
include = ["greeter*"]
